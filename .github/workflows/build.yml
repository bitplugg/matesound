name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: matesound-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-apk:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: matesound-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debug-apk, release-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: matesound-debug
          path: dist/debug

      - uses: actions/download-artifact@v4
        with:
          name: matesound-release-unsigned
          path: dist/release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release create "${GITHUB_REF_NAME}" \
            debug/app-debug.apk \
            release/app-release-unsigned.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "matesound ${GITHUB_REF_NAME}" \
            --notes "The debug APK is signed with the Android debug key and can be installed directly (enable installation from unknown sources). The release APK is unsigned — sign it locally with apksigner before installing."
